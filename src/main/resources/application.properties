spring.application.name=twitter-clone

# Sunucu
server.port=8080

# PostgreSQL baglantisi
spring.datasource.url=jdbc:postgresql://localhost:5432/twitter_clone
spring.datasource.username=ss
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# React frontend CORS icin (3200 portu)
app.cors.allowed-origin=http://localhost:3200
